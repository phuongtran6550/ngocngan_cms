upstream ngocchau_api_v2 {
  server 127.0.0.1:4100;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.tiembacngocchau.vn;

  if ($http_x_forwarded_proto = "http") {
    return 301 https://api.tiembacngocchau.vn$request_uri;
  }

  access_log /home/https/logs/api/ngocchau-v2-access.log;
  error_log /home/https/logs/api/ngocchau-v2-error.log warn;

  client_max_body_size 30m;
  client_body_buffer_size 256k;
  client_body_timeout 120s;
  keepalive_timeout 65s;
  send_timeout 120s;

  location / {
    proxy_pass http://ngocchau_api_v2;
    proxy_http_version 1.1;

    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
