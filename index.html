<!doctype html>
<html lang="vi" data-bs-theme="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#67131d" />
    <meta name="application-name" content="Ngọc Châu CMS" />
    <meta name="description" content="Hệ thống quản trị Ngọc Châu." />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/ngoc-chau-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/ngoc-chau-favicon-16.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/brand/ngoc-chau-favicon-180.png"
    />
    <title>Ngọc Châu CMS</title>
    <script>
      try {
        const theme = localStorage.getItem("ngocchau.theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.bsTheme = theme;
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
